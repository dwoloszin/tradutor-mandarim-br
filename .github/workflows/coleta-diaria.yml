name: Coleta diária (nuvem)

# Roda de madrugada, sozinho. O que for bloqueado por ser IP de datacenter não vira
# erro: a tarefa fica marcada como "adiado_local" na fila e espera a rodada no PC do
# Dario (`python -m scraper.cli pendentes`), que usa IP residencial.

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 no horário de Brasília
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de tarefas por etapa (vazio = sem limite)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: coleta-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Chromium (para as agendas que exigem JavaScript)
        run: python -m playwright install --with-deps chromium

      - name: Rodar coleta
        env:
          MJ_AMBIENTE: nuvem
          PYTHONIOENCODING: utf-8
        run: python -m scraper.cli tudo --limite ${{ github.event.inputs.limite || '60' }}

      - name: Commitar dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.jsonl docs/data/*.json
          if git diff --cached --quiet; then
            echo "nada mudou nesta rodada"
          else
            git commit -m "dados: coleta automática $(date -u +%Y-%m-%d)"
            # outra rodada pode ter commitado enquanto esta rodava
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Resumo da rodada
        if: always()
        env:
          MJ_AMBIENTE: nuvem
          PYTHONIOENCODING: utf-8
        run: |
          {
            echo "### Situação após a coleta"
            echo '```'
            python -m scraper.cli situacao
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
